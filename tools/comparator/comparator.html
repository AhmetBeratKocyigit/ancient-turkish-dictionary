<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divânu Lugāti't-Türk Sözlük Veri Onarım Arayüzü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Üst Bar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-book-bookmark text-amber-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">DLT Sözlük Veri Onarım Arayüzü</h1>
            </div>
            <button id="downloadBtn" disabled onclick="downloadJSON()" class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-download"></i>
                <span>Güncellenmiş JSON'u İndir</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full flex-1 p-6 space-y-6">

        <!-- Dosya Yükleme Paneli -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col items-center justify-center relative hover:border-amber-500 transition">
                <i class="fa-solid fa-file-code text-amber-500 text-3xl mb-2"></i>
                <span class="font-semibold text-sm">1. Orijinal Veri (dlt.json)</span>
                <span id="origStatus" class="text-xs text-slate-400 mt-1">Dosya seçilmedi</span>
                <input type="file" id="origFile" accept=".json" onchange="handleFileLoad('orig')" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col items-center justify-center relative hover:border-blue-500 transition">
                <i class="fa-solid fa-file-circle-check text-blue-500 text-3xl mb-2"></i>
                <span class="font-semibold text-sm">2. Temizlenmiş Veri (llm_temizlenmis.json)</span>
                <span id="cleanedStatus" class="text-xs text-slate-400 mt-1">Dosya seçilmedi</span>
                <input type="file" id="cleanedFile" accept=".json" onchange="handleFileLoad('cleaned')" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>
        </div>

        <!-- İstatistik Metrikleri -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <div class="text-xs text-slate-400 uppercase font-semibold">Orijinal Toplam</div>
                <div id="statOrig" class="text-2xl font-bold text-slate-100 mt-1">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <div class="text-xs text-slate-400 uppercase font-semibold">İşlenmiş Veri</div>
                <div id="statCleaned" class="text-2xl font-bold text-blue-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <div class="text-xs text-slate-400 uppercase font-semibold">Eksilen Kayıt Sayısı</div>
                <div id="statMissing" class="text-2xl font-bold text-rose-500 mt-1">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <div class="text-xs text-slate-400 uppercase font-semibold">Kurtarılan / Eklenen</div>
                <div id="statRestored" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
            </div>
        </div>

        <!-- Karşılaştırma & Ekleme Ekranı -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl flex flex-col h-[550px] overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/50">
                <div class="flex items-center space-x-3">
                    <h2 class="font-bold text-lg flex items-center space-x-2">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
                        <span>Eksik Kayıtlar</span>
                    </h2>
                    <span id="listCount" class="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-full">0 Bulundu</span>
                </div>

                <div class="flex items-center space-x-3 w-full md:w-auto">
                    <!-- Eşleştirme Türü Seçimi -->
                    <select id="modeSelect" onchange="compareData()" class="bg-slate-900 text-xs border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500">
                        <option value="index">Eşleştirme Türü: Sıra / İndeks Bazlı (Önerilen)</option>
                        <option value="word">Eşleştirme Türü: Sadece Kelime Adı</option>
                    </select>

                    <button id="addAllBtn" disabled onclick="restoreAll()" class="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1 whitespace-nowrap">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Tümünü Ekip Onar</span>
                    </button>
                </div>
            </div>

            <!-- Liste Alanı -->
            <div id="missingList" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4">
                <div class="text-center text-slate-500 py-20">
                    <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-50"></i>
                    <p>Karşılaştırmak için 2 JSON dosyasını da yükleyin.</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        let originalData = [];
        let cleanedData = [];
        let missingItems = [];
        let restoredCount = 0;

        function handleFileLoad(type) {
            const input = document.getElementById(type === 'orig' ? 'origFile' : 'cleanedFile');
            const status = document.getElementById(type === 'orig' ? 'origStatus' : 'cleanedStatus');
            const file = input.files[0];

            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (type === 'orig') {
                        originalData = parsed;
                        status.innerText = `${file.name} (${parsed.length} Kayıt)`;
                        status.className = "text-xs text-emerald-400 mt-1";
                    } else {
                        cleanedData = parsed;
                        status.innerText = `${file.name} (${parsed.length} Kayıt)`;
                        status.className = "text-xs text-emerald-400 mt-1";
                    }
                    compareData();
                } catch (err) {
                    alert('Geçersiz JSON dosyası!');
                    status.innerText = "Yükleme Hatası!";
                    status.className = "text-xs text-rose-400 mt-1";
                }
            };
            reader.readAsText(file);
        }

        function getItemKey(item) {
            if (!item) return "";
            const kelime = item.kelime || item.madde || item.word || "";
            return String(kelime).trim().toLocaleLowerCase('tr-TR');
        }

        function compareData() {
            if (!originalData.length || !cleanedData.length) return;

            const mode = document.getElementById('modeSelect').value;

            if (mode === 'index') {
                // İndeks bazlı kontrol (Orijinal verinin sonunda atlanan tüm kayıtları kesin yakalar)
                missingItems = originalData.slice(cleanedData.length);
            } else {
                // Kelime bazlı kontrol
                const cleanedKeys = new Set(cleanedData.map(item => getItemKey(item)));
                missingItems = originalData.filter(item => {
                    const key = getItemKey(item);
                    return key !== "" && !cleanedKeys.has(key);
                });
            }

            updateStats();
            renderMissingList();
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('addAllBtn').disabled = missingItems.length === 0;
        }

        function updateStats() {
            document.getElementById('statOrig').innerText = originalData.length;
            document.getElementById('statCleaned').innerText = cleanedData.length;
            document.getElementById('statMissing').innerText = missingItems.length;
            document.getElementById('statRestored').innerText = restoredCount;
            document.getElementById('listCount').innerText = `${missingItems.length} Eksik Bulundu`;
        }

        function renderMissingList() {
            const listContainer = document.getElementById('missingList');
            listContainer.innerHTML = '';

            if (missingItems.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center text-emerald-400 py-20">
                        <i class="fa-solid fa-circle-check text-5xl mb-3"></i>
                        <p class="font-medium">Harika! Eksik hiçbir kayıt bulunamadı.</p>
                    </div>`;
                return;
            }

            missingItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-700 rounded-lg p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-500 transition";

                const content = document.createElement('div');
                content.className = "flex-1 space-y-2 w-full";
                
                content.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="bg-amber-500/10 text-amber-400 text-xs px-2 py-0.5 rounded font-mono">Orijinal İndeks #${originalData.indexOf(item)}</span>
                        <h3 class="font-bold text-amber-200 text-lg">${item.kelime || item.madde || 'İsimsiz Kelime'}</h3>
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded border border-slate-800 text-xs font-mono text-slate-300 overflow-x-auto max-h-32 custom-scroll">
                        <pre>${JSON.stringify(item, null, 2)}</pre>
                    </div>
                `;

                const restoreBtn = document.createElement('button');
                restoreBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded font-medium transition flex items-center space-x-1.5 whitespace-nowrap self-end md:self-center";
                restoreBtn.innerHTML = `<i class="fa-solid fa-plus"></i><span>Listeye Ekle</span>`;
                restoreBtn.onclick = () => restoreItem(index);

                card.appendChild(content);
                card.appendChild(restoreBtn);
                listContainer.appendChild(card);
            });
        }

        function restoreItem(index) {
            const itemToRestore = missingItems[index];
            cleanedData.push(itemToRestore);
            missingItems.splice(index, 1);
            restoredCount++;
            
            updateStats();
            renderMissingList();
        }

        function restoreAll() {
            if (missingItems.length === 0) return;
            
            cleanedData.push(...missingItems);
            restoredCount += missingItems.length;
            missingItems = [];
            
            updateStats();
            renderMissingList();
        }

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanedData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "llm_temizlenmis_sozluk_tamamlanmis.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
